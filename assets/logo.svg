<svg width="256" height="44" viewBox="0 0 256 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="peak2partners">
  <defs>
    <linearGradient id="peakFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaff"/>
      <stop offset="1" stop-color="#2f8fd6"/>
    </linearGradient>
    <linearGradient id="peakFrontShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc3ee"/>
      <stop offset="1" stop-color="#0b35b3"/>
    </linearGradient>
    <linearGradient id="peakBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8da4d8"/>
      <stop offset="1" stop-color="#33437a"/>
    </linearGradient>
    <radialGradient id="apexGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#65c1ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#65c1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f4fe"/>
      <stop offset="1" stop-color="#a9d8ff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe0ff"/>
      <stop offset="1" stop-color="#0b35b3"/>
    </linearGradient>
    <linearGradient id="connector" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65c1ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#65c1ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <line x1="0" y1="36" x2="46" y2="36" stroke="#f1f4fe" stroke-opacity=".15" stroke-width="1"/>

  <!-- back peak (partner) -->
  <polygon points="32,14 20,36 44,36" fill="url(#peakBack)"/>
  <circle cx="32" cy="14" r="1.6" fill="#65c1ff" fill-opacity=".7"/>

  <!-- summit link -->
  <line x1="16" y1="6" x2="32" y2="14" stroke="url(#connector)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- front peak (self), faceted light/shadow sides -->
  <polygon points="16,6 4,36 16,36" fill="url(#peakFront)"/>
  <polygon points="16,6 16,36 28,36" fill="url(#peakFrontShade)"/>

  <!-- summit glow + node -->
  <circle cx="16" cy="6" r="9" fill="url(#apexGlow)"/>
  <circle cx="16" cy="6" r="2.6" fill="#f1f4fe"/>
  <circle cx="16" cy="6" r="1.1" fill="#65c1ff"/>

  <!-- wordmark -->
  <text x="56" y="29" font-family="'IBM Plex Mono','SF Mono',ui-monospace,monospace" font-size="22" font-weight="500" letter-spacing="-0.5" fill="url(#textShine)">peak</text>

  <rect x="114" y="11" width="20" height="20" rx="6" fill="url(#badge)"/>
  <text x="124" y="25.5" font-family="'IBM Plex Mono','SF Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#00082a">2</text>

  <text x="142" y="29" font-family="'IBM Plex Mono','SF Mono',ui-monospace,monospace" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#f1f4fe">partners</text>
</svg>
